# Local development database. Project name "hisaab"; never reuse CodeJudge's project, ports or volumes.
name: hisaab

services:
  db:
    # postgres:18.6-alpine3.24, pinned by multi-arch index digest (pushed 2026-09-21).
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: hisaab
      # Local-only dev password; the port is bound to 127.0.0.1. Not a secret.
      POSTGRES_PASSWORD: hisaab_dev_only
      POSTGRES_DB: hisaab
    # Sized for the 256 MB limit.
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=30
    ports:
      - "127.0.0.1:5434:5432"
    # Postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker; mount the parent.
    volumes:
      - pg:/var/lib/postgresql
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hisaab -d hisaab"]
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      app: hisaab

volumes:
  pg:
    name: hisaab_pg
